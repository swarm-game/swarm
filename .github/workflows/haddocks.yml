# Simple workflow for deploying static HADDOCKS content to GitHub Pages
name: Deploy Haddocks to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # TODO: delete this before merging, so it only runs on master!!!
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: setup-haskell-cabal
        name: Setup Haskell
        with:
          ghc-version: "9.12.1"
          cabal-version: "3.16.0.0"
      - name: Build haddocks
        run: cabal haddock-project --output haddocks --hackage --hoogle --all
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'haddocks'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
